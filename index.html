<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キッズマネー - たのしく学べるお小遣いアプリ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <h1 id="app-title">キッズマネー</h1>
    <div class="mode-toggle">
      <button id="mode-btn" class="btn-secondary">こどもモードにきりかえ</button>
    </div>
  </header>

  <main class="container">
    <!-- 子供選択セクション -->
    <section class="section child-selection-section">
      <h2 class="section-title">たいしょうのこども</h2>
      <div id="children-list" class="children-grid">
        <!-- JSで動的生成 -->
      </div>
      <div class="add-child-box">
        <input type="text" id="new-child-name" placeholder="なまえをニュウリョク">
        <button id="add-child-btn" class="btn-primary">こどもを追加</button>
      </div>
    </section>

    <!-- ダッシュボード（今日のお金・合計） -->
    <section class="section dashboard-section">
      <div class="card-grid">
        <div class="card today-card">
          <h3 class="card-label">きょうのおかね</h3>
          <div id="today-money" class="money-amount">0 円</div>
        </div>
        <div class="card total-card">
          <h3 class="card-label">ぜんぶのおかね</h3>
          <div id="total-money" class="money-amount">0 円</div>
        </div>
      </div>
    </section>

    <!-- 勉強・クイズ学習セクション -->
    <section class="section quiz-section">
      <h2 class="section-title" id="quiz-section-title">お金のクイズに挑戦しよう！</h2>
      <div class="quiz-card">
        <div id="quiz-question" class="quiz-question-text">クイズを準備中...</div>
        <div id="quiz-options" class="quiz-options-container">
          <!-- 選択肢が動的生成されます -->
        </div>
        <div id="quiz-feedback" class="quiz-feedback hidden"></div>
        <button id="next-quiz-btn" class="btn-primary hidden">つぎの問題へ</button>
      </div>
    </section>

    <!-- 勉強記録セクション -->
    <section class="section education-section">
      <h2 class="section-title" id="study-section-title">べんきょうの記録</h2>
      <form id="study-form" class="study-input-form">
        <input type="text" id="study-subject" placeholder="べんきょうしたこと (例: さんすう)" required>
        <input type="number" id="study-minutes" placeholder="じかん (ぷん)" min="1" required>
        <input type="number" id="study-reward" placeholder="ごほうび (えん)" min="0" required>
        <button type="submit" class="btn-primary">きろくする</button>
      </form>

      <ul id="study-logs" class="study-logs-list">
        <!-- JSで選択中の子供の記録を表示 -->
      </ul>
    </section>
  </main>

  <script src="./app.js"></script>
  <script src="./education.js"></script>
  <script src="./learn.js"></script>
</body>
</html>
