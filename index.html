<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>こどものお金ラボ V32</title>
<link rel="stylesheet" href="./style.css?v=32">
</head>
<body>
<header class="app-header">
  <div><div class="eyebrow">KIDS MONEY LAB</div><h1>こどものお金ラボ</h1></div>
  <div class="header-actions"><label class="mode-switch"><input id="kidMode" type="checkbox"><span>こどもモード</span></label><button id="settings" class="secondary" type="button">⚙️ 設定</button></div>
</header>
<main class="container">
  <div id="errorBox" class="error hidden"></div>
  <section class="child-panel card">
    <div class="child-main"><span class="label">対象の子ども</span><strong id="selectedChildName">-</strong><div class="child-actions"><select id="child" aria-label="対象の子ども"></select><button id="addChild" class="primary" type="button">＋ 子どもを追加</button></div></div>
  </section>
  <nav class="tabs" aria-label="メニュー">
    <button class="tab active" data-tab="home" type="button">🏠 ホーム</button>
    <button class="tab" data-tab="money" type="button">💰 お金</button>
    <button class="tab" data-tab="education" type="button">📚 学習</button>
    <button class="tab" data-tab="learn" type="button">🎯 クイズ</button>
    <button class="tab" data-tab="goals" type="button">⭐ 目標</button>
  </nav>

  <section id="home" class="panel active">
    <div class="summary-grid">
      <div class="summary-card"><span id="totalL">総資産</span><strong id="total">¥0</strong><small id="note">投資損益 ¥0</small></div>
      <div class="summary-card"><span id="cashL">貯金</span><strong id="cash">¥0</strong></div>
      <div class="summary-card"><span id="investL">投資</span><strong id="invest">¥0</strong></div>
    </div>
    <div class="section-header"><h2>今日のお金</h2><span class="muted">選択中の子どもの記録</span></div>
    <div id="todayMoney"></div>
    <div class="section-header"><h2>資産</h2></div><div id="assets" class="asset-grid"></div>
    <div class="section-header"><h2>最近の記録</h2><div class="button-group"><button id="in" class="primary" type="button">＋ 入金</button><button id="out" class="secondary" type="button">− 出金</button></div></div>
    <div id="homeTxs"></div>
  </section>

  <section id="money" class="panel">
    <div class="section-header"><div><h2>お金の記録</h2><p class="muted">入金・出金を子どもごとに管理します。</p></div><div class="button-group"><button id="in2" class="primary" type="button">＋ 入金</button><button id="out2" class="secondary" type="button">− 出金</button></div></div>
    <div class="filters"><label>種類<select id="tf"><option value="all">すべて</option><option value="in">入金</option><option value="out">出金</option></select></label><label>資産<select id="af"><option value="all">すべて</option></select></label></div><div id="moneyTxs"></div>
  </section>

  <section id="education" class="panel"><div class="card"><p class="muted">学習データを読み込んでいます…</p></div></section>
  <section id="learn" class="panel"><div class="card"><p class="muted">クイズを読み込んでいます…</p></div></section>
  <section id="goals" class="panel"><div class="section-header"><h2>目標</h2><button id="addGoal" class="primary" type="button">＋ 目標を追加</button></div><div id="goalsList"></div></section>

  <section class="panel-tools">
    <details><summary>将来シミュレーション</summary><div class="form-grid"><label>年間追加額<input id="annual" type="number" min="0" value="120000"></label><label>年数<input id="years" type="number" min="1" value="10"></label><label>ためる割合<input id="saveRatio" type="range" min="0" max="100" value="50"></label><button id="simulate" class="secondary" type="button">計算</button></div><div id="result"></div></details>
  </section>
</main>

<div id="childModal" class="modal hidden"><div class="modal-box"><div class="section-header"><h2 id="childModalTitle">子どもを追加</h2><button class="icon-button" data-close="childModal" type="button">×</button></div><form id="childForm"><label>名前<input id="childName" required></label><label>生まれた年<input id="birth" type="number" min="2000" max="2030" required></label><button id="childSubmit" class="primary wide" type="submit">追加</button></form></div></div>
<div id="txModal" class="modal hidden"><div class="modal-box"><div class="section-header"><h2 id="txTitle">入金を追加</h2><button class="icon-button" data-close="txModal" type="button">×</button></div><form id="txForm"><input id="txType" type="hidden" value="in"><label>日付<input id="date" type="date" required></label><label>金額<input id="amount" type="number" min="1" required></label><label>種類<select id="asset"></select></label><label>理由<input id="reason" type="text" placeholder="おこづかいなど"></label><label>メモ<textarea id="memo" rows="3"></textarea></label><button id="txSubmit" class="primary wide" type="submit">記録する</button></form></div></div>
<div id="goalModal" class="modal hidden"><div class="modal-box"><div class="section-header"><h2>目標を追加</h2><button class="icon-button" data-close="goalModal" type="button">×</button></div><form id="goalForm"><label>目標名<input id="goalName" required></label><label>金額<input id="goalAmount" type="number" min="1" required></label><label>期限<input id="goalDate" type="date"></label><label>いま貯めた金額<input id="goalSaved" type="number" min="0" value="0"></label><button class="primary wide" type="submit">追加</button></form></div></div>
<div id="settingsModal" class="modal hidden"><div class="modal-box"><div class="section-header"><h2>設定</h2><button class="icon-button" data-close="settingsModal" type="button">×</button></div><div class="settings-list"><button id="export" class="secondary wide" type="button">データを書き出す</button><label class="file-button wide">データを読み込む<input id="import" type="file" accept="application/json"></label><button id="reset" class="danger wide" type="button">データをすべて削除</button></div></div></div>

<script src="./app.js?v=32" defer></script>
<script src="./education.js?v=32" defer></script>
<script src="./learn.js?v=32" defer></script>
</body>
</html>
