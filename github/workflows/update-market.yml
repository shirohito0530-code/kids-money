name: Update Market Data

on:
  schedule:
    - cron: "30 23 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-market:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch market data
        run: |

          python <<'PY'

          import json
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone


          MARKETS = {

              "world": {
                  "name": "全世界株式",
                  "symbol": "ACWI",
                  "proxy": True
              },

              "sp": {
                  "name": "S&P500",
                  "symbol": "^GSPC",
                  "proxy": False
              }

          }


          def fetch_chart(symbol):

              encoded =
                  urllib.parse.quote(
                      symbol,
                      safe=""
                  )

              url = (
                  "https://query1.finance.yahoo.com/"
                  "v8/finance/chart/"
                  + encoded
                  + "?range=10y&interval=1d"
              )

              request =
                  urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0"
                      }
                  )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  return json.load(
                      response
                  )


          def parse_series(data):

              result =
                  data[
                      "chart"
                  ][
                      "result"
                  ][0]

              timestamps =
                  result.get(
                      "timestamp",
                      []
                  )

              quotes =
                  result[
                      "indicators"
                  ][
                      "quote"
                  ][0]

              closes =
                  quotes.get(
                      "close",
                      []
                  )


              series = []


              for timestamp, close in zip(
                  timestamps,
                  closes
              ):

                  if close is None:
                      continue

                  dt =
                      datetime.fromtimestamp(
                          timestamp,
                          timezone.utc
                      )

                  series.append({

                      "date":
                          dt.date()
                            .isoformat(),

                      "value":
                          float(close)

                  })


              series.sort(
                  key=lambda x:
                      x["date"]
              )


              return series


          output = {

              "version": 2,

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "markets": {}

          }


          for key, config in MARKETS.items():

              print(
                  "Fetching:",
                  config["symbol"]
              )


              data =
                  fetch_chart(
                      config["symbol"]
                  )


              series =
                  parse_series(
                      data
                  )


              if not series:

                  raise RuntimeError(
                      "No data: " +
                      key
                  )


              latest =
                  series[-1]


              previous = (
                  series[-2]
                  if len(series) >= 2
                  else None
              )


              change = 0


              if previous:

                  prev =
                      previous["value"]

                  current =
                      latest["value"]

                  if prev:

                      change = (
                          current /
                          prev -
                          1
                      ) * 100


              output[
                  "markets"
              ][key] = {

                  "name":
                      config["name"],

                  "symbol":
                      config["symbol"],

                  "proxy":
                      config["proxy"],

                  "latest": latest,

                  "change":
                      change,

                  "series":
                      series

              }


          with open(
              "data/market.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "market.json updated"
          )

          print(
              "updated:",
              output["updated"]
          )

          PY

      - name: Commit market data
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market.json

          if git diff --cached --quiet; then

            echo "No market data changes."

          else

            git commit \
              -m "Update market data"

            git push

          fi
